<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUWEL Deadlines</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--tu-font-sans, system-ui, -apple-system, sans-serif);
      background: var(--tu-bg-base, #0f172a);
      color: var(--tu-text-primary, #f8fafc);
      padding: 16px;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--tu-border-subtle, #1e293b);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-icon {
      width: 24px;
      height: 24px;
      border-radius: var(--tu-radius-sm, 4px);
      background: var(--tu-accent, #006699);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tu-accent-contrast, #fff);
      font-weight: 700;
      font-size: 11px;
    }
    .title {
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--tu-accent, #006699);
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--tu-text-muted, #64748b);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--tu-success, #10b981);
      box-shadow: 0 0 6px var(--tu-success, #10b981);
    }
    .stats-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-pill {
      flex: 1;
      background: var(--tu-bg-surface, #1e293b);
      border: 1px solid var(--tu-border, #334155);
      border-radius: var(--tu-radius-sm, 4px);
      padding: 6px 10px;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .stat-pill span {
      color: var(--tu-text-secondary, #94a3b8);
    }
    .stat-pill strong {
      color: var(--tu-text-primary, #f8fafc);
      font-weight: 700;
    }
    .deadlines-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      overflow-y: auto;
    }
    .card {
      background: var(--tu-bg-surface, #1e293b);
      padding: 12px 14px;
      border-radius: var(--tu-radius, 8px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--tu-border, #334155);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .card:hover {
      background: var(--tu-bg-hover, #475569);
      border-color: var(--tu-border-focus, #38bdf8);
      transform: translateY(-1px);
    }
    .card.completed {
      opacity: 0.5;
      text-decoration: line-through;
      border-color: transparent;
    }
    .course-label {
      font-size: 10.5px;
      color: var(--tu-text-secondary, #94a3b8);
      font-weight: 500;
      margin-bottom: 2px;
    }
    .task-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--tu-text-primary, #f8fafc);
    }
    .due-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: var(--tu-radius-sm, 4px);
      background: var(--tu-danger, #ef4444);
      color: #ffffff;
      font-weight: 600;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .due-badge.warning {
      background: var(--tu-warning, #f59e0b);
    }
    .due-badge.normal {
      background: var(--tu-bg-card, #334155);
      color: var(--tu-text-primary, #f8fafc);
      border: 1px solid var(--tu-border, #475569);
    }
    .footer {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid var(--tu-border-subtle, #1e293b);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--tu-text-muted, #64748b);
    }
    .btn-sync {
      background: transparent;
      border: 1px solid var(--tu-border, #334155);
      color: var(--tu-text-secondary, #94a3b8);
      padding: 4px 8px;
      border-radius: var(--tu-radius-sm, 4px);
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s ease;
    }
    .btn-sync:hover {
      background: var(--tu-bg-hover, #475569);
      color: var(--tu-text-primary, #f8fafc);
      border-color: var(--tu-accent, #006699);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="badge-icon">TU</div>
      <div class="title">TUWEL Upcoming Deadlines</div>
    </div>
    <div class="status-indicator">
      <div class="pulse-dot" id="live-dot"></div>
      <span id="sync-status">Connecting...</span>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-pill">
      <span>Pending</span>
      <strong id="stat-pending">3</strong>
    </div>
    <div class="stat-pill">
      <span>Urgent (&lt;24h)</span>
      <strong id="stat-urgent" style="color: var(--tu-danger, #ef4444);">1</strong>
    </div>
    <div class="stat-pill">
      <span>Completed</span>
      <strong id="stat-completed">0</strong>
    </div>
  </div>

  <div class="deadlines-list" id="deadlines-list"></div>

  <div class="footer">
    <span>Last checked: <span id="last-checked">Just now</span></span>
    <button class="btn-sync" id="btn-refresh">↻ Refresh TUWEL</button>
  </div>

  <script type="module">
    let port = null;
    let reqId = 0;
    const pending = new Map();

    const items = [
      { id: "1", course: "VU Algorithmen und Datenstrukturen", task: "Abgabe Aufgabe 2 (Graph Search)", due: "Tomorrow, 23:59", urgency: "danger", completed: false },
      { id: "2", course: "UE Analysis 1", task: "Übungsblatt 4 (Integration)", due: "In 3 days", urgency: "warning", completed: false },
      { id: "3", course: "VO Technische Grundlagen der Informatik", task: "Zwischentest Quiz Online", due: "Oct 20, 18:00", urgency: "normal", completed: false },
      { id: "4", course: "PR Software Engineering & PM", task: "Milestone 1 Architecture Review", due: "Oct 24, 12:00", urgency: "normal", completed: false }
    ];

    window.addEventListener("message", (e) => {
      if (e.data?.type === "INIT_RPC_PORT") {
        port = e.ports[0];
        port.onmessage = (msg) => {
          const { id, method, params, result, error } = msg.data || {};
          if (method === "theme:changed") {
            // Document styles automatically updated by injected CSS
            return;
          }
          if (!id) return;
          const p = pending.get(id);
          if (p) {
            pending.delete(id);
            error ? p.reject(error) : p.resolve(result);
          }
        };
        init();
      }
    });

    function call(method, params = {}) {
      return new Promise((resolve, reject) => {
        if (!port) return resolve(null);
        const id = `req_${++reqId}`;
        pending.set(id, { resolve, reject });
        port.postMessage({ jsonrpc: "2.0", id, method, params });
      });
    }

    function render() {
      const container = document.getElementById("deadlines-list");
      container.innerHTML = items.map(item => `
        <div class="card ${item.completed ? 'completed' : ''}" data-id="${item.id}">
          <div>
            <div class="course-label">${item.course}</div>
            <div class="task-name">${item.task}</div>
          </div>
          <div class="due-badge ${item.urgency === 'danger' ? '' : item.urgency === 'warning' ? 'warning' : 'normal'}">
            ${item.completed ? '✓ Done' : item.due}
          </div>
        </div>
      `).join("");

      // Update counters
      const pendingCount = items.filter(i => !i.completed).length;
      const urgentCount = items.filter(i => !i.completed && i.urgency === "danger").length;
      const completedCount = items.filter(i => i.completed).length;

      document.getElementById("stat-pending").innerText = pendingCount;
      document.getElementById("stat-urgent").innerText = urgentCount;
      document.getElementById("stat-completed").innerText = completedCount;

      // Click to toggle completion
      document.querySelectorAll(".card").forEach(el => {
        el.addEventListener("click", () => {
          const id = el.getAttribute("data-id");
          const target = items.find(i => i.id === id);
          if (target) {
            target.completed = !target.completed;
            render();
            call("storage:set", { key: "tuwel_completed_items", value: JSON.stringify(items.map(i => ({ id: i.id, completed: i.completed }))) });
          }
        });
      });
    }

    async function init() {
      await call("lifecycle:ready");
      document.getElementById("sync-status").innerText = "Live Synced";

      // Load saved state if any
      try {
        const saved = await call("storage:get", { key: "tuwel_completed_items" });
        if (saved) {
          const parsed = JSON.parse(saved);
          parsed.forEach(p => {
            const match = items.find(i => i.id === p.id);
            if (match) match.completed = p.completed;
          });
        }
      } catch (e) {
        console.warn("Storage load error:", e);
      }

      render();

      document.getElementById("btn-refresh").addEventListener("click", async () => {
        document.getElementById("sync-status").innerText = "Refreshing...";
        try {
          // Attempt network fetch via sandboxed RPC
          await call("http:request", {
            url: "https://tuwel.tuwien.ac.at/calendar/export.php",
            method: "GET"
          });
        } catch (e) {
          // Handled gracefully
        }
        document.getElementById("sync-status").innerText = "Live Synced";
        document.getElementById("last-checked").innerText = new Date().toLocaleTimeString();
      });
    }

    // Fallback if rendered outside RPC host
    setTimeout(() => {
      if (!port) {
        document.getElementById("sync-status").innerText = "Standalone Mode";
        render();
      }
    }, 600);
  </script>
</body>
</html>
