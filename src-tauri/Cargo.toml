[package]
name = "tu-cockpit"
version = "0.1.0"
description = "TU Cockpit - Desktop Hub & Dynamic Plugin Ecosystem for TU Wien Students"
authors = ["TU Wien Community"]
edition = "2021"
repository = "https://github.com/tu-cockpit-community/TU-Cockpit"
homepage = "https://github.com/tu-cockpit-community/TU-Cockpit"

[lib]
name = "tu_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["unstable"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.10"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
totp-lite = "2.0.1"
base32 = "0.5.1"
keyring = "4.2.0"
url = "2.5.8"
